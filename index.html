<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hängeplan</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="kopf">
    <div>
      <h1 data-text="appTitel">Hängeplan</h1>
      <p class="untertitel" data-text="untertitel"></p>
    </div>
    <div class="werkzeuge" id="werkzeuge"></div>
  </header>

  <section class="anmeldung" id="anmeldung" hidden></section>
  <section class="aufhaengen" id="aufhaengen" hidden></section>

  <main class="layout" id="app" hidden>
    <div class="eingaben" id="eingaben">
      <section id="ausstellung"></section>
      <section id="waende"></section>
      <section id="reihenfolge"></section>
      <section id="werke"></section>
      <section id="gruppen"></section>
      <section id="screens"></section>
    </div>
    <div class="ergebnisse">
      <section id="stand3d"></section>
      <section id="vorschau"></section>
      <section id="hinweise"></section>
      <section id="ergebnis"></section>
    </div>
  </main>

  <nav class="sprungleiste" id="sprungleiste" aria-label="Navigation" hidden>
    <a href="#eingaben" data-text="navEingaben"></a>
    <a href="#stand3d" data-text="navStand"></a>
    <a href="#vorschau" data-text="navVorschau"></a>
    <a href="#ergebnis" data-text="navPunkte"></a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
